name: Deploy to EC2
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'frontend/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC 토큰 발급 권한
      contents: read  # 저장소 코드 읽기

    steps:
      # 코드 가져오기
      - name: Checkout code  # 이름표
        uses: actions/checkout@v4 # 코드 가져오기

      # JDK 설치
      - name: Set Up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: 'gradle' # gradle 의존성 캐시 저장

      # gradlew 실행 권한 부여
      - name: Grant gradlew
        run: chmod +x ./gradlew

      # 빌드(테스트 제외)
      - name: Build gradle without Test
        run: ./gradlew clean build -x test

      # ARM 아키텍처 빌드를 위한 번역기 세팅 ---
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Debug OIDC values
        run: |
          echo "Repo: ${{ github.repository }}"
          echo "Ref: ${{ github.ref }}"
          echo "Role ARN: ${{ vars.AWS_ROLE_ARN }}"
          echo "Region: ${{ vars.AWS_REGION }}"  

      # aws 자격 증명 - OIDC
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # ECR 로그인
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      # Docker 빌드 및 push
      - name: Build and push Docker image
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          IMAGE_URI=${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ vars.ECR_REPOSITORY }}
                            
          # Docker 빌드
          docker build --platform linux/arm64 -t $IMAGE_URI:$SHORT_SHA .
                            
          # ECR push
          docker push $IMAGE_URI:$SHORT_SHA
                            
          # 결과 출력
          echo "✅ Pushed: $IMAGE_URI:$SHORT_SHA"   

      # EC2에 원격 접속하여 배포 실행
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          # GitHub Actions에서 쓰던 변수들을 SSH 쉘 환경으로 넘겨주기 위해 세팅합니다.
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          # github.sha는 전체 해시(40자리)이므로 잘라서 사용하지 않고 그대로 넘기거나, 여기서 바로 7자리를 잘라줄 수 있습니다.
          SHORT_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: AWS_REGION, AWS_ACCOUNT_ID, ECR_REPOSITORY, SHORT_SHA
          script_stop: true
          script: |
            IMAGE_TAG=$(echo $SHORT_SHA | cut -c1-7)
            IMAGE_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY

            echo "배포 시작: $IMAGE_URI:$IMAGE_TAG"
            
            aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com
          
            docker pull $IMAGE_URI:$IMAGE_TAG

            docker stop api-server || true
            docker rm api-server || true
            
            docker run -d --name api-server -p 8080:8080 --network kafka_kafka-net --env-file /home/ec2-user/.env $IMAGE_URI:$IMAGE_TAG

            docker image prune -f
    



