<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>9신사 | 오늘의 스타일을 찾다</title>
<link rel="stylesheet" href="css/reset.css" />
<link rel="stylesheet" href="css/variables.css" />
<link rel="stylesheet" href="css/layout.css" />
<link rel="stylesheet" href="css/components.css" />
</head>
<body>
<div class="page">
  <header class="site-header">
    <div class="site-header__inner">
      <a href="index.html" class="site-logo">9신사</a>
      <nav class="site-nav">
        <a href="index.html" class="is-active">전체상품</a>
        <a href="ranking.html">랭킹</a>
      </nav>
      <div class="site-search">
        <span aria-hidden="true">🔍</span>
        <input type="search" placeholder="상품을 검색해보세요" />
      </div>
      <div class="site-actions">
        <a href="cart.html" class="icon-link">
          🛒 장바구니
          <span class="cart-badge" data-cart-badge hidden>0</span>
        </a>
        <span data-auth-area></span>
      </div>
    </div>
    <div class="category-bar">
      <div class="category-bar__inner" data-category-bar></div>
    </div>
  </header>

  <main class="page-main">
    <div class="container">
      <section style="background: var(--color-surface); border-radius: var(--radius-lg); padding: var(--space-8) var(--space-6); margin-bottom: var(--space-7); text-align:center;">
        <p class="text-sub" style="font-weight:700; letter-spacing:0.08em;">NEW SEASON</p>
        <h1 style="font-size: var(--fs-3xl); font-weight:800; margin-top: var(--space-2);">오늘의 스타일을 찾다, 9신사</h1>
        <p class="text-sub mt-2">지금 가장 인기 있는 아이템을 만나보세요</p>
      </section>

      <section style="margin-bottom: var(--space-8);">
        <div class="page-header">
          <div>
            <h2 class="page-title" style="font-size: var(--fs-xl);">🔥 실시간 인기 상품</h2>
          </div>
          <a href="ranking.html" class="btn btn-ghost btn-sm">랭킹 전체보기</a>
        </div>
        <div class="product-grid" data-ranking-preview style="grid-template-columns: repeat(5, 1fr);"></div>
      </section>

      <section>
        <div class="page-header">
          <h2 class="page-title" style="font-size: var(--fs-xl);" data-product-title>전체 상품</h2>
          <span class="text-sub" data-product-count></span>
        </div>
        <div class="product-grid" data-product-grid></div>
        <nav class="pagination">
          <button type="button">‹</button>
          <button type="button" class="is-active">1</button>
          <button type="button">2</button>
          <button type="button">3</button>
          <button type="button">›</button>
        </nav>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="site-footer__inner">
      <div class="site-footer__brand">9신사</div>
      <div class="site-footer__links">
        <a href="#">이용약관</a>
        <a href="#">개인정보처리방침</a>
        <a href="#">고객센터</a>
      </div>
      <p class="site-footer__meta">
        상호명 9신사 · 대표 이재석 · 이찬서 · 이동희<br />
        본 페이지는 팀 프로젝트 데모 화면이며 실제 서비스가 아닙니다.
      </p>
    </div>
  </footer>
</div>

<script src="js/mock-data.js"></script>
<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script>
  function productCard(p) {
    const soldOut = p.status === "SOLD_OUT";
    return `
      <a href="product-detail.html?id=${p.id}" class="product-card">
        <div class="product-card__thumb" data-thumb="${p.name}" data-thumb-url="${p.thumbnailUrl || ""}">
          ${soldOut ? `<span class="badge badge-neutral product-card__badge">품절</span>` : ""}
        </div>
        <div class="product-card__name">${p.name}</div>
        <div class="product-card__price">${formatPrice(p.price)}</div>
        <div class="product-card__meta">${p.categoryName}</div>
      </a>
    `;
  }

  function rankPreviewCard(item) {
    return `
    <a href="product-detail.html?id=${item.id}" class="product-card">
      <div class="product-card__thumb" data-thumb="${item.title}" data-thumb-url="${item.thumbnailUrl || ""}">
        <span class="badge product-card__badge" style="background:var(--color-accent); color:#fff;">${item.rank}위</span>
      </div>
      <div class="product-card__name">${item.title}</div>
      <div class="product-card__price">인기점수 ${item.score.toFixed(1)}</div>
    </a>
  `;
  }

  function mountThumbs(container) {
    container.querySelectorAll("[data-thumb]").forEach((el) => {
      const badge = el.querySelector(".product-card__badge");
      el.prepend(renderThumb(el.dataset.thumb, el.dataset.thumbUrl || ""));
      if (badge) el.appendChild(badge);
    });
  }

  async function loadRankingPreview() {
    const el = document.querySelector("[data-ranking-preview]");
    try {
      const ranking = await Api.getRankingDaily(5);
      if (!ranking || ranking.length === 0) {
        el.innerHTML = `<p class="text-faint" style="grid-column:1/-1;">아직 집계된 인기 상품이 없습니다.</p>`;
        return;
      }
      el.innerHTML = ranking.map((item, i) => rankPreviewCard({ ...item, rank: i + 1 })).join("");
      mountThumbs(el);
    } catch (e) {
      el.innerHTML = `<p class="text-faint" style="grid-column:1/-1;">인기 상품을 불러오지 못했습니다.</p>`;
    }
  }

  async function loadProducts() {
    const categoryId = new URLSearchParams(location.search).get("categoryId");
    const gridEl = document.querySelector("[data-product-grid]");
    const titleEl = document.querySelector("[data-product-title]");
    const countEl = document.querySelector("[data-product-count]");
    const paginationEl = document.querySelector(".pagination");
    const PAGE_SIZE = 20;

    gridEl.innerHTML = `<p class="text-faint">상품을 불러오는 중...</p>`;
    paginationEl.innerHTML = "";

    let products;
    let categories;
    try {
      [products, categories] = await Promise.all([
        Api.getProducts(categoryId || undefined),
        Api.getCategories(),
      ]);
    } catch (e) {
      gridEl.innerHTML = `<p class="text-faint">${apiErrorMessage(e, "상품을 불러오지 못했습니다.")}</p>`;
      return;
    }

    titleEl.textContent = categoryId
      ? categories.find((c) => String(c.id) === categoryId)?.name || "전체 상품"
      : "전체 상품";
    countEl.textContent = `총 ${products.length.toLocaleString("ko-KR")}개`;

    const totalPages = Math.max(1, Math.ceil(products.length / PAGE_SIZE));
    let currentPage = 1;

    function renderPage(page) {
      currentPage = Math.min(Math.max(1, page), totalPages);
      const items = products.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);
      gridEl.innerHTML = items.length ? items.map(productCard).join("") : `<p class="text-faint">상품이 없습니다.</p>`;
      mountThumbs(gridEl);
      renderPaginationButtons();
    }

    function renderPaginationButtons() {
      const windowSize = 5;
      const end = Math.min(totalPages, Math.max(windowSize, currentPage + 2));
      const start = Math.max(1, end - windowSize + 1);

      let html = `<button type="button" data-page="${currentPage - 1}" ${currentPage === 1 ? "disabled" : ""}>‹</button>`;
      for (let p = start; p <= end; p++) {
        html += `<button type="button" data-page="${p}" class="${p === currentPage ? "is-active" : ""}">${p}</button>`;
      }
      html += `<button type="button" data-page="${currentPage + 1}" ${currentPage === totalPages ? "disabled" : ""}>›</button>`;
      paginationEl.innerHTML = html;
    }

    paginationEl.addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-page]");
      if (!btn || btn.disabled) return;
      renderPage(Number(btn.dataset.page));
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    renderPage(1);
  }

  document.addEventListener("DOMContentLoaded", () => {
    loadRankingPreview();
    loadProducts();
  });
</script>
</body>
</html>
