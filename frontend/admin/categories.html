<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>카테고리 관리 | 9신사 Admin</title>
<link rel="stylesheet" href="../css/reset.css" />
<link rel="stylesheet" href="../css/variables.css" />
<link rel="stylesheet" href="../css/layout.css" />
<link rel="stylesheet" href="../css/components.css" />
<link rel="stylesheet" href="../css/admin.css" />
</head>
<body>
<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="admin-sidebar__logo">9신사<span>ADMIN</span></div>
    <nav class="admin-nav">
      <a href="index.html">대시보드</a>
      <a href="categories.html" class="is-active">카테고리 관리</a>
      <a href="products.html">상품 관리</a>
      <a href="payments.html">결제 관리</a>
    </nav>
    <div class="admin-sidebar__footer">
      <a href="../index.html" style="color:inherit;">← 고객 화면으로</a>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <div>
        <h1 class="admin-topbar__title">카테고리 관리</h1>
        <p class="admin-topbar__desc">상품 카테고리를 등록/수정/삭제합니다.</p>
      </div>
      <button type="button" class="btn btn-primary" data-add-category-btn>+ 카테고리 추가</button>
    </div>

    <div class="table-wrap">
      <table class="table">
        <thead>
          <tr>
            <th style="width:80px;">ID</th>
            <th>카테고리명</th>
            <th style="width:160px;"></th>
          </tr>
        </thead>
        <tbody data-category-body></tbody>
      </table>
    </div>
  </main>
</div>

<div class="modal-overlay" data-category-modal hidden>
  <div class="modal">
    <div class="modal__header">
      <span class="modal__title" data-modal-title>카테고리 추가</span>
      <button type="button" class="modal__close" data-modal-close>×</button>
    </div>
    <form data-category-form>
      <div class="field">
        <label for="categoryName">카테고리 이름</label>
        <input class="input" type="text" id="categoryName" required />
      </div>
      <div class="modal__actions">
        <button type="button" class="btn btn-outline" data-modal-close>취소</button>
        <button type="submit" class="btn btn-primary">저장</button>
      </div>
    </form>
  </div>
</div>

<script src="../js/mock-data.js"></script>
<script src="../js/api.js"></script>
<script src="../js/main.js"></script>
<script>
  let currentCategories = [];
  let editingCategoryId = null;

  function categoryRow(c) {
    return `
      <tr>
        <td>${c.id}</td>
        <td>${c.name}</td>
        <td>
          <button type="button" class="btn btn-outline btn-sm" data-edit-btn="${c.id}">수정</button>
          <button type="button" class="btn btn-ghost btn-sm" data-delete-btn="${c.id}">삭제</button>
        </td>
      </tr>`;
  }

  async function loadCategories() {
    const body = document.querySelector("[data-category-body]");
    if (!isLoggedIn()) {
      body.innerHTML = `<tr><td colspan="3" class="text-faint">관리자 계정으로 로그인이 필요합니다. <a href="../login.html">로그인하러 가기</a></td></tr>`;
      return;
    }
    try {
      currentCategories = await Api.getAdminCategories();
      body.innerHTML = currentCategories.map(categoryRow).join("");
    } catch (e) {
      body.innerHTML = `<tr><td colspan="3" class="text-faint">${apiErrorMessage(e, "카테고리를 불러오지 못했습니다.")}</td></tr>`;
    }
  }

  document.addEventListener("DOMContentLoaded", () => {
    loadCategories();

    const modal = document.querySelector("[data-category-modal]");
    const form = document.querySelector("[data-category-form]");
    const openModal = () => (modal.hidden = false);
    const closeModal = () => {
      modal.hidden = true;
      form.reset();
    };

    document.querySelector("[data-add-category-btn]").addEventListener("click", () => {
      editingCategoryId = null;
      document.querySelector("[data-modal-title]").textContent = "카테고리 추가";
      openModal();
    });
    document.querySelectorAll("[data-modal-close]").forEach((btn) => btn.addEventListener("click", closeModal));

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const body = { name: form.querySelector("#categoryName").value };
      const submitBtn = form.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      try {
        if (editingCategoryId) {
          await Api.updateAdminCategory(editingCategoryId, body);
        } else {
          await Api.createAdminCategory(body);
        }
        showToast("저장되었습니다.");
        closeModal();
        loadCategories();
      } catch (err) {
        showToast(apiErrorMessage(err, "저장에 실패했습니다."));
      } finally {
        submitBtn.disabled = false;
      }
    });

    document.querySelector("[data-category-body]").addEventListener("click", async (e) => {
      if (e.target.matches("[data-edit-btn]")) {
        const id = Number(e.target.dataset.editBtn);
        const category = currentCategories.find((c) => c.id === id);
        editingCategoryId = id;
        document.querySelector("[data-modal-title]").textContent = "카테고리 수정";
        form.querySelector("#categoryName").value = category ? category.name : "";
        openModal();
      } else if (e.target.matches("[data-delete-btn]")) {
        const id = Number(e.target.dataset.deleteBtn);
        try {
          await Api.deleteAdminCategory(id);
          showToast("삭제되었습니다.");
          loadCategories();
        } catch (err) {
          showToast(apiErrorMessage(err, "삭제에 실패했습니다."));
        }
      }
    });
  });
</script>
</body>
</html>
