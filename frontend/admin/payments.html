<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>결제 관리 | 9신사 Admin</title>
<link rel="stylesheet" href="../css/reset.css" />
<link rel="stylesheet" href="../css/variables.css" />
<link rel="stylesheet" href="../css/layout.css" />
<link rel="stylesheet" href="../css/components.css" />
<link rel="stylesheet" href="../css/admin.css" />
</head>
<body>
<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="admin-sidebar__logo">9신사<span>ADMIN</span></div>
    <nav class="admin-nav">
      <a href="index.html">대시보드</a>
      <a href="categories.html">카테고리 관리</a>
      <a href="products.html">상품 관리</a>
      <a href="payments.html" class="is-active">결제 관리</a>
    </nav>
    <div class="admin-sidebar__footer">
      <a href="../index.html" style="color:inherit;">← 고객 화면으로</a>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <div>
        <h1 class="admin-topbar__title">결제 관리</h1>
        <p class="admin-topbar__desc">전체 결제 내역을 조회합니다.</p>
      </div>
    </div>

    <div class="admin-toolbar">
      <div class="admin-filters">
        <select class="select" data-filter-status>
          <option value="">전체 상태</option>
          <option value="PENDING">결제대기</option>
          <option value="PAID">결제완료</option>
          <option value="FAILED">결제실패</option>
          <option value="CANCELED">결제취소</option>
        </select>
      </div>
    </div>

    <div class="table-wrap">
      <table class="table">
        <thead>
          <tr>
            <th>결제ID</th>
            <th>주문ID</th>
            <th>PortOne 결제ID</th>
            <th>상품금액</th>
            <th>결제금액</th>
            <th>상태</th>
            <th>결제일시</th>
            <th></th>
          </tr>
        </thead>
        <tbody data-payment-body></tbody>
      </table>
    </div>
  </main>
</div>

<div class="modal-overlay" data-payment-modal hidden>
  <div class="modal">
    <div class="modal__header">
      <span class="modal__title">결제 상세</span>
      <button type="button" class="modal__close" data-modal-close>×</button>
    </div>
    <div data-payment-detail></div>
  </div>
</div>

<script src="../js/mock-data.js"></script>
<script src="../js/api.js"></script>
<script src="../js/main.js"></script>
<script>
  let currentPayments = [];

  function renderPayments(list) {
    const body = document.querySelector("[data-payment-body]");
    if (list.length === 0) {
      body.innerHTML = `<tr><td colspan="8" class="text-faint">결제 내역이 없습니다.</td></tr>`;
      return;
    }
    body.innerHTML = list
      .map((p) => {
        const label = PAYMENT_STATUS_LABEL[p.status] || { text: p.status, cls: "badge-neutral" };
        return `
        <tr>
          <td>#${p.paymentId}</td>
          <td>#${p.orderId}</td>
          <td>${p.portonePaymentId || "-"}</td>
          <td>${formatPrice(p.totalProductAmount)}</td>
          <td>${formatPrice(p.paymentAmount)}</td>
          <td><span class="badge ${label.cls}">${label.text}</span></td>
          <td>${formatDate(p.createdAt)}</td>
          <td><button type="button" class="btn btn-outline btn-sm" data-detail-btn="${p.paymentId}">상세</button></td>
        </tr>`;
      })
      .join("");
  }

  document.addEventListener("DOMContentLoaded", async () => {
    const body = document.querySelector("[data-payment-body]");
    if (!isLoggedIn()) {
      body.innerHTML = `<tr><td colspan="8" class="text-faint">관리자 계정으로 로그인이 필요합니다. <a href="../login.html">로그인하러 가기</a></td></tr>`;
      return;
    }
    try {
      currentPayments = await Api.getAdminPayments();
      renderPayments(currentPayments);
    } catch (e) {
      body.innerHTML = `<tr><td colspan="8" class="text-faint">${apiErrorMessage(e, "결제 내역을 불러오지 못했습니다.")}</td></tr>`;
      return;
    }

    document.querySelector("[data-filter-status]").addEventListener("change", (e) => {
      const status = e.target.value;
      renderPayments(status ? currentPayments.filter((p) => p.status === status) : currentPayments);
    });

    const modal = document.querySelector("[data-payment-modal]");
    document.querySelectorAll("[data-modal-close]").forEach((btn) =>
      btn.addEventListener("click", () => (modal.hidden = true))
    );

    document.querySelector("[data-payment-body]").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-detail-btn]");
      if (!btn) return;
      const payment = currentPayments.find((p) => p.paymentId === Number(btn.dataset.detailBtn));
      const label = PAYMENT_STATUS_LABEL[payment.status] || { text: payment.status, cls: "badge-neutral" };
      document.querySelector("[data-payment-detail]").innerHTML = `
        <div style="display:flex; justify-content:space-between; margin-bottom: var(--space-3);">
          <span class="text-sub">결제ID</span><span>#${payment.paymentId}</span>
        </div>
        <div style="display:flex; justify-content:space-between; margin-bottom: var(--space-3);">
          <span class="text-sub">주문ID</span><span>#${payment.orderId}</span>
        </div>
        <div style="display:flex; justify-content:space-between; margin-bottom: var(--space-3);">
          <span class="text-sub">PortOne 결제ID</span><span>${payment.portonePaymentId || "-"}</span>
        </div>
        <div style="display:flex; justify-content:space-between; margin-bottom: var(--space-3);">
          <span class="text-sub">상태</span><span class="badge ${label.cls}">${label.text}</span>
        </div>
        <div style="display:flex; justify-content:space-between; margin-bottom: var(--space-3);">
          <span class="text-sub">결제금액</span><span style="font-weight:800;">${formatPrice(payment.paymentAmount)}</span>
        </div>
        <div style="display:flex; justify-content:space-between; margin-bottom: var(--space-3);">
          <span class="text-sub">승인일시</span><span>${formatDate(payment.approvedAt)}</span>
        </div>
        <div style="display:flex; justify-content:space-between; margin-bottom: var(--space-4);">
          <span class="text-sub">취소일시</span><span>${formatDate(payment.canceledAt)}</span>
        </div>
        <div style="border-top:1px solid var(--color-border); padding-top: var(--space-4);">
          <span class="text-sub" style="font-weight:700;">주문 상품</span>
          ${payment.items
            .map((i) => `<div style="display:flex; justify-content:space-between; margin-top: var(--space-2); font-size: var(--fs-sm);"><span>${i.productName}</span><span>${i.quantity}개</span></div>`)
            .join("")}
        </div>
      `;
      modal.hidden = false;
    });
  });
</script>
</body>
</html>
