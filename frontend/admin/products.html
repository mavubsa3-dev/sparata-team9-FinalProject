<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>상품 관리 | 9신사 Admin</title>
<link rel="stylesheet" href="../css/reset.css" />
<link rel="stylesheet" href="../css/variables.css" />
<link rel="stylesheet" href="../css/layout.css" />
<link rel="stylesheet" href="../css/components.css" />
<link rel="stylesheet" href="../css/admin.css" />
</head>
<body>
<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="admin-sidebar__logo">9신사<span>ADMIN</span></div>
    <nav class="admin-nav">
      <a href="index.html">대시보드</a>
      <a href="categories.html">카테고리 관리</a>
      <a href="products.html" class="is-active">상품 관리</a>
      <a href="payments.html">결제 관리</a>
    </nav>
    <div class="admin-sidebar__footer">
      <a href="../index.html" style="color:inherit;">← 고객 화면으로</a>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <div>
        <h1 class="admin-topbar__title">상품 관리</h1>
        <p class="admin-topbar__desc">상품을 등록/수정/삭제하고 판매 상태를 관리합니다.</p>
      </div>
      <button type="button" class="btn btn-primary" data-add-product-btn>+ 상품 등록</button>
    </div>

    <div class="admin-toolbar">
      <div class="admin-filters">
        <select class="select" data-filter-category>
          <option value="">전체 카테고리</option>
        </select>
        <select class="select" data-filter-status>
          <option value="">전체 상태</option>
          <option value="ON_SALE">판매중</option>
          <option value="SOLD_OUT">품절</option>
          <option value="HIDDEN">숨김</option>
        </select>
        <input class="input" type="text" placeholder="상품명 검색" data-filter-keyword />
      </div>
    </div>

    <div class="table-wrap">
      <table class="table">
        <thead>
          <tr>
            <th>상품</th>
            <th>카테고리</th>
            <th>가격</th>
            <th>재고</th>
            <th>상태</th>
            <th style="width:160px;"></th>
          </tr>
        </thead>
        <tbody data-product-body></tbody>
      </table>
    </div>

    <nav class="pagination">
      <button type="button">‹</button>
      <button type="button" class="is-active">1</button>
      <button type="button">2</button>
      <button type="button">›</button>
    </nav>
  </main>
</div>

<div class="modal-overlay" data-product-modal hidden>
  <div class="modal" style="max-width: 560px;">
    <div class="modal__header">
      <span class="modal__title" data-modal-title>상품 등록</span>
      <button type="button" class="modal__close" data-modal-close>×</button>
    </div>
    <form data-product-form>
      <div class="field">
        <label for="thumbnailFile">상품 이미지</label>
        <input class="input" type="file" id="thumbnailFile" accept="image/*" />
        <span class="hint">multipart/form-data로 업로드됩니다. (POST /api/admin/products/images)</span>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="categoryId">카테고리</label>
          <select class="select" id="categoryId" data-category-options required></select>
        </div>
        <div class="field">
          <label for="status">상태</label>
          <select class="select" id="status" required>
            <option value="ON_SALE">판매중</option>
            <option value="SOLD_OUT">품절</option>
            <option value="HIDDEN">숨김</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label for="name">상품명</label>
        <input class="input" type="text" id="name" required />
      </div>
      <div class="field">
        <label for="description">상품 설명</label>
        <textarea class="textarea" id="description" required></textarea>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="price">가격</label>
          <input class="input" type="number" id="price" min="100" required />
        </div>
        <div class="field">
          <label for="stock">재고 수량</label>
          <input class="input" type="number" id="stock" min="0" required />
        </div>
      </div>
      <div class="modal__actions">
        <button type="button" class="btn btn-outline" data-modal-close>취소</button>
        <button type="submit" class="btn btn-primary">저장</button>
      </div>
    </form>
  </div>
</div>

<script src="../js/mock-data.js"></script>
<script src="../js/api.js"></script>
<script src="../js/main.js"></script>
<script>
  const PAGE_SIZE = 20;
  let categories = [];
  let currentRows = [];
  let currentPageNumber = 0; // 0-based (백엔드 Pageable 기준)
  let totalPages = 1;
  let editingProduct = null; // 수정 중인 상품(목록 행 데이터), null이면 신규 등록

  function renderProducts(list) {
    const body = document.querySelector("[data-product-body]");
    if (list.length === 0) {
      body.innerHTML = `<tr><td colspan="6" class="text-faint">상품이 없습니다.</td></tr>`;
      return;
    }
    body.innerHTML = list
      .map((p) => {
        const label = PRODUCT_STATUS_LABEL[p.status] || { text: p.status, cls: "badge-neutral" };
        return `
        <tr>
          <td>
            <div class="thumb-cell" data-thumb-cell="${p.name}">
              <span>${p.name}</span>
            </div>
          </td>
          <td>${p.categoryName || "-"}</td>
          <td>${formatPrice(p.price)}</td>
          <td>${p.stock}</td>
          <td><span class="badge ${label.cls}">${label.text}</span></td>
          <td>
            <button type="button" class="btn btn-outline btn-sm" data-edit-btn="${p.id}">수정</button>
            <button type="button" class="btn btn-ghost btn-sm" data-delete-btn="${p.id}">삭제</button>
          </td>
        </tr>`;
      })
      .join("");

    body.querySelectorAll("[data-thumb-cell]").forEach((el) => {
      const thumb = document.createElement("div");
      thumb.style.cssText = "width:40px;height:40px;border-radius:4px;overflow:hidden;flex-shrink:0;";
      const row = list.find((p) => p.name === el.dataset.thumbCell);
      thumb.appendChild(renderThumb(el.dataset.thumbCell, row ? row.thumbnailUrl : ""));
      el.prepend(thumb);
    });
  }

  function renderPagination() {
    const el = document.querySelector(".pagination");
    const windowSize = 5;
    const current = currentPageNumber; // 0-based
    let start = Math.max(0, current - 2);
    let end = Math.min(totalPages - 1, start + windowSize - 1);
    start = Math.max(0, end - windowSize + 1);

    let html = `<button type="button" data-page="${current - 1}" ${current === 0 ? "disabled" : ""}>‹</button>`;
    for (let p = start; p <= end; p++) {
      html += `<button type="button" data-page="${p}" class="${p === current ? "is-active" : ""}">${p + 1}</button>`;
    }
    html += `<button type="button" data-page="${current + 1}" ${current >= totalPages - 1 ? "disabled" : ""}>›</button>`;
    el.innerHTML = html;
  }

  async function loadProducts(page = 0) {
    const body = document.querySelector("[data-product-body]");
    if (!isLoggedIn()) {
      body.innerHTML = `<tr><td colspan="6" class="text-faint">관리자 계정으로 로그인이 필요합니다. <a href="../login.html">로그인하러 가기</a></td></tr>`;
      document.querySelector(".pagination").innerHTML = "";
      return;
    }

    const category = document.querySelector("[data-filter-category]").value;
    const status = document.querySelector("[data-filter-status]").value;
    const keyword = document.querySelector("[data-filter-keyword]").value.trim();

    const params = new URLSearchParams({ page: String(page), size: String(PAGE_SIZE) });
    if (category) params.set("category", category);
    if (status) params.set("status", status);
    if (keyword) params.set("productName", keyword);

    body.innerHTML = `<tr><td colspan="6" class="text-faint">불러오는 중...</td></tr>`;
    try {
      const result = await Api.getAdminProducts(params.toString());
      currentRows = result.content;
      currentPageNumber = result.page.number;
      totalPages = Math.max(1, result.page.totalPages);
      renderProducts(currentRows);
      renderPagination();
    } catch (e) {
      body.innerHTML = `<tr><td colspan="6" class="text-faint">${apiErrorMessage(e, "상품을 불러오지 못했습니다.")}</td></tr>`;
      document.querySelector(".pagination").innerHTML = "";
    }
  }

  document.addEventListener("DOMContentLoaded", async () => {
    const categorySelect = document.querySelector("[data-filter-category]");
    const modalCategorySelect = document.querySelector("[data-category-options]");

    if (isLoggedIn()) {
      try {
        categories = await Api.getAdminCategories();
        categories.forEach((c) => {
          categorySelect.insertAdjacentHTML("beforeend", `<option value="${c.name}">${c.name}</option>`);
          modalCategorySelect.insertAdjacentHTML("beforeend", `<option value="${c.id}">${c.name}</option>`);
        });
      } catch (e) {
        // 카테고리 조회 실패해도 상품 목록 자체는 시도
      }
    }

    loadProducts(0);

    document.querySelector(".pagination").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-page]");
      if (!btn || btn.disabled) return;
      loadProducts(Number(btn.dataset.page));
    });

    document.querySelector("[data-filter-category]").addEventListener("change", () => loadProducts(0));
    document.querySelector("[data-filter-status]").addEventListener("change", () => loadProducts(0));

    let keywordTimer;
    document.querySelector("[data-filter-keyword]").addEventListener("input", () => {
      clearTimeout(keywordTimer);
      keywordTimer = setTimeout(() => loadProducts(0), 400);
    });

    const modal = document.querySelector("[data-product-modal]");
    const form = document.querySelector("[data-product-form]");
    const openModal = () => (modal.hidden = false);
    const closeModal = () => {
      modal.hidden = true;
      form.reset();
    };

    document.querySelector("[data-add-product-btn]").addEventListener("click", () => {
      editingProduct = null;
      document.querySelector("[data-modal-title]").textContent = "상품 등록";
      form.reset();
      openModal();
    });
    document.querySelectorAll("[data-modal-close]").forEach((btn) => btn.addEventListener("click", closeModal));

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const submitBtn = form.querySelector('button[type="submit"]');
      submitBtn.disabled = true;

      try {
        let thumbnailUrl = editingProduct ? editingProduct.thumbnailUrl : undefined;
        const file = form.querySelector("#thumbnailFile").files[0];
        if (file) {
          const uploaded = await Api.uploadProductImage(file);
          thumbnailUrl = uploaded.imageUrl;
        }

        const body = {
          categoryId: Number(form.querySelector("#categoryId").value),
          name: form.querySelector("#name").value,
          description: form.querySelector("#description").value,
          thumbnailUrl,
          price: Number(form.querySelector("#price").value),
          stock: Number(form.querySelector("#stock").value),
        };

        if (editingProduct) {
          body.status = form.querySelector("#status").value;
          await Api.updateAdminProduct(editingProduct.id, body);
        } else {
          await Api.createAdminProduct(body);
        }
        showToast("저장되었습니다.");
        closeModal();
        loadProducts(currentPageNumber);
      } catch (err) {
        showToast(apiErrorMessage(err, "저장에 실패했습니다."));
      } finally {
        submitBtn.disabled = false;
      }
    });

    document.querySelector("[data-product-body]").addEventListener("click", async (e) => {
      if (e.target.matches("[data-edit-btn]")) {
        const id = Number(e.target.dataset.editBtn);
        const row = currentRows.find((p) => p.id === id);
        if (!row) return;
        editingProduct = row;

        document.querySelector("[data-modal-title]").textContent = "상품 수정";
        form.reset();
        form.querySelector("#name").value = row.name;
        form.querySelector("#description").value = row.description;
        form.querySelector("#price").value = row.price;
        form.querySelector("#stock").value = row.stock;
        form.querySelector("#status").value = row.status;
        const matchedCategory = categories.find((c) => c.name === row.categoryName);
        if (matchedCategory) form.querySelector("#categoryId").value = String(matchedCategory.id);
        openModal();
      } else if (e.target.matches("[data-delete-btn]")) {
        const id = Number(e.target.dataset.deleteBtn);
        if (!confirm("이 상품을 삭제할까요?")) return;
        try {
          await Api.deleteAdminProduct(id);
          showToast("삭제되었습니다.");
          loadProducts(currentPageNumber);
        } catch (err) {
          showToast(apiErrorMessage(err, "삭제에 실패했습니다."));
        }
      }
    });
  });
</script>
</body>
</html>
