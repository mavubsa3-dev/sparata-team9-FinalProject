<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>장바구니 | 9신사</title>
<link rel="stylesheet" href="css/reset.css" />
<link rel="stylesheet" href="css/variables.css" />
<link rel="stylesheet" href="css/layout.css" />
<link rel="stylesheet" href="css/components.css" />
</head>
<body>
<div class="page">
  <header class="site-header">
    <div class="site-header__inner">
      <a href="index.html" class="site-logo">9신사</a>
      <nav class="site-nav">
        <a href="index.html">전체상품</a>
        <a href="ranking.html">랭킹</a>
      </nav>
      <div class="site-search">
        <span aria-hidden="true">🔍</span>
        <input type="search" placeholder="상품을 검색해보세요" />
      </div>
      <div class="site-actions">
        <a href="cart.html" class="icon-link">
          🛒 장바구니
          <span class="cart-badge" data-cart-badge hidden>0</span>
        </a>
        <span data-auth-area></span>
      </div>
    </div>
  </header>

  <main class="page-main">
    <div class="container">
      <div class="page-header">
        <h1 class="page-title">장바구니</h1>
      </div>

      <div style="display:grid; grid-template-columns: 1fr 320px; gap: var(--space-6); align-items:start;">
        <div>
          <div class="checkbox-row" style="margin-bottom: var(--space-4);">
            <input type="checkbox" id="select-all" checked />
            <label for="select-all">전체선택</label>
            <button type="button" class="btn btn-ghost btn-sm" style="margin-left:auto;" data-clear-cart-btn>전체삭제</button>
          </div>

          <div data-cart-list></div>
          <div class="empty-state" data-cart-empty hidden>
            <div class="empty-state__icon">🛒</div>
            <div class="empty-state__title">장바구니가 비어있습니다</div>
            <a href="index.html" class="btn btn-outline btn-sm">쇼핑하러 가기</a>
          </div>
        </div>

        <div class="card" style="position:sticky; top: calc(var(--header-height) + var(--space-5));">
          <div class="card__title">결제 예상 금액</div>
          <div style="display:flex; justify-content:space-between; margin-top: var(--space-4); font-size: var(--fs-sm);">
            <span class="text-sub">상품금액</span>
            <span data-cart-total>0원</span>
          </div>
          <div style="display:flex; justify-content:space-between; margin-top: var(--space-2); font-size: var(--fs-sm);">
            <span class="text-sub">배송비</span>
            <span>무료</span>
          </div>
          <div style="display:flex; justify-content:space-between; margin-top: var(--space-4); padding-top: var(--space-4); border-top: 1px solid var(--color-border); font-weight:800; font-size: var(--fs-lg);">
            <span>총 결제금액</span>
            <span data-cart-total-2>0원</span>
          </div>
          <a href="checkout.html" class="btn btn-primary btn-block mt-6">주문하기</a>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="site-footer__inner">
      <div class="site-footer__brand">9신사</div>
      <p class="site-footer__meta">본 페이지는 팀 프로젝트 데모 화면이며 실제 서비스가 아닙니다.</p>
    </div>
  </footer>
</div>

<script src="js/mock-data.js"></script>
<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script>
  function cartRow(item) {
    return `
      <div class="card" style="display:flex; align-items:center; gap: var(--space-4);" data-cart-row="${item.cartItemId}">
        <input type="checkbox" checked />
        <div class="product-card__thumb" data-thumb="${item.productName}" data-thumb-url="${item.thumbnailUrl || ""}" style="width:80px; height:80px; flex-shrink:0;"></div>
        <div style="flex:1; min-width:0;">
          <div style="font-weight:700;">${item.productName}</div>
          <div class="text-sub mt-2" style="font-size: var(--fs-sm);">${formatPrice(item.price)}</div>
        </div>
        <div class="stepper">
          <button type="button" data-qty-minus>−</button>
          <input type="text" value="${item.quantity}" data-qty-input readonly />
          <button type="button" data-qty-plus>+</button>
        </div>
        <div style="width:100px; text-align:right; font-weight:800;" data-line-amount>${formatPrice(item.lineAmount)}</div>
        <button type="button" class="btn btn-ghost btn-sm" data-remove-btn>삭제</button>
      </div>
    `;
  }

  async function loadCart() {
    const listEl = document.querySelector("[data-cart-list]");
    const emptyEl = document.querySelector("[data-cart-empty]");

    if (!isLoggedIn()) {
      listEl.hidden = true;
      emptyEl.hidden = false;
      emptyEl.innerHTML = `
        <div class="empty-state__icon">🔒</div>
        <div class="empty-state__title">로그인이 필요합니다</div>
        <a href="login.html" class="btn btn-outline btn-sm">로그인하러 가기</a>
      `;
      document.querySelector("[data-cart-total]").textContent = formatPrice(0);
      document.querySelector("[data-cart-total-2]").textContent = formatPrice(0);
      return;
    }

    let cart;
    try {
      cart = await Api.getCart();
    } catch (e) {
      listEl.hidden = true;
      emptyEl.hidden = false;
      emptyEl.innerHTML = `<div class="empty-state__title">${apiErrorMessage(e, "장바구니를 불러오지 못했습니다.")}</div>`;
      return;
    }

    if (cart.items.length === 0) {
      listEl.hidden = true;
      emptyEl.hidden = false;
      emptyEl.innerHTML = `
        <div class="empty-state__icon">🛒</div>
        <div class="empty-state__title">장바구니가 비어있습니다</div>
        <a href="index.html" class="btn btn-outline btn-sm">쇼핑하러 가기</a>
      `;
    } else {
      listEl.hidden = false;
      emptyEl.hidden = true;
      listEl.innerHTML = cart.items.map(cartRow).join("");
      listEl.querySelectorAll("[data-thumb]").forEach((el) => el.appendChild(renderThumb(el.dataset.thumb, el.dataset.thumbUrl || "")));
    }

    document.querySelector("[data-cart-total]").textContent = formatPrice(cart.totalAmount);
    document.querySelector("[data-cart-total-2]").textContent = formatPrice(cart.totalAmount);
    initHeader();
  }

  document.addEventListener("DOMContentLoaded", () => {
    loadCart();

    document.querySelector("[data-cart-list]").addEventListener("click", async (e) => {
      const row = e.target.closest("[data-cart-row]");
      if (!row) return;
      const cartItemId = Number(row.dataset.cartRow);

      if (e.target.matches("[data-qty-plus], [data-qty-minus]")) {
        const qtyInput = row.querySelector("[data-qty-input]");
        const current = Number(qtyInput.value);
        const next = e.target.matches("[data-qty-plus]") ? current + 1 : Math.max(1, current - 1);
        if (next === current) return;
        try {
          await Api.updateCartItem(cartItemId, { quantity: next });
          loadCart();
        } catch (err) {
          showToast(apiErrorMessage(err, "수량 변경에 실패했습니다."));
        }
      } else if (e.target.matches("[data-remove-btn]")) {
        try {
          await Api.deleteCartItem(cartItemId);
          loadCart();
        } catch (err) {
          showToast(apiErrorMessage(err, "삭제에 실패했습니다."));
        }
      }
    });

    document.querySelector("[data-clear-cart-btn]").addEventListener("click", async () => {
      try {
        await Api.clearCart();
        loadCart();
      } catch (err) {
        showToast(apiErrorMessage(err, "장바구니 비우기에 실패했습니다."));
      }
    });
  });
</script>
</body>
</html>
