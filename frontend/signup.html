<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>회원가입 | 9신사</title>
<link rel="stylesheet" href="css/reset.css" />
<link rel="stylesheet" href="css/variables.css" />
<link rel="stylesheet" href="css/layout.css" />
<link rel="stylesheet" href="css/components.css" />
</head>
<body>
<div class="page">
  <header class="site-header">
    <div class="site-header__inner">
      <a href="index.html" class="site-logo">9신사</a>
    </div>
  </header>

  <div class="auth-shell">
    <div class="auth-card" style="max-width: 440px;">
      <div class="auth-card__logo">회원가입</div>
      <form data-signup-form novalidate>
        <div class="field">
          <label for="email">이메일</label>
          <input class="input" type="email" id="email" placeholder="you@example.com" required />
          <span class="error">이메일 형식이 올바르지 않습니다.</span>
        </div>
        <div class="field">
          <label for="password">비밀번호</label>
          <input class="input" type="password" id="password" placeholder="영문·숫자·특수문자 포함 8~15자" required />
          <span class="hint">영문, 숫자, 특수문자를 포함해 8~15자로 입력해주세요.</span>
        </div>
        <div class="field">
          <label for="name">이름</label>
          <input class="input" type="text" id="name" placeholder="홍길동" required />
        </div>
        <div class="field">
          <label for="phoneNumber">전화번호</label>
          <input class="input" type="tel" id="phoneNumber" placeholder="010-1234-5678" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block">회원가입</button>
      </form>
      <p class="auth-card__footer">이미 계정이 있으신가요? <a href="login.html">로그인</a></p>
    </div>
  </div>

  <footer class="site-footer">
    <div class="site-footer__inner">
      <div class="site-footer__brand">9신사</div>
      <p class="site-footer__meta">본 페이지는 팀 프로젝트 데모 화면이며 실제 서비스가 아닙니다.</p>
    </div>
  </footer>
</div>

<script src="js/mock-data.js"></script>
<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script>
  document.querySelector("[data-signup-form]").addEventListener("submit", async (e) => {
    e.preventDefault();
    const body = {
      email: document.querySelector("#email").value,
      password: document.querySelector("#password").value,
      name: document.querySelector("#name").value,
      phoneNumber: document.querySelector("#phoneNumber").value,
    };
    const submitBtn = e.target.querySelector('button[type="submit"]');

    submitBtn.disabled = true;
    try {
      await Api.signup(body);
      showToast("회원가입이 완료되었습니다.");
      setTimeout(() => (location.href = "login.html"), 500);
    } catch (err) {
      showToast(apiErrorMessage(err, "회원가입에 실패했습니다."));
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>
