
services:
  # -------------------------- EC2 #3 : Kafka 서버 (2 CPU / 2GB 예산 공유) --------------------------
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    cpus: 1.3
    mem_limit: 1200m
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_HEAP_OPTS: "-Xmx700M -Xms700M"

      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - kafka-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    cpus: 0.5
    mem_limit: 600m
    ports:
      - "8088:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-kraft
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: true
      JAVA_OPTS: "-Xmx450m"
    depends_on:
      - kafka
    networks:
      - kafka-net

  redis:
    image: redis:latest
    container_name: redis
    cpus: 0.2
    mem_limit: 200m
    ports:
      - "16379:6379"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "150mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    networks:
      - kafka-net

  # -------------------------- EC2 #1 : 결제 서버 --------------------------
  payment-server:
    build: .
    container_name: payment-server
    cpus: 2.0
    mem_limit: 2g
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATASOURCE_URL: jdbc:mysql://${DB_HOST}:3306/ShoppingDB?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${RDS_USER}
      SPRING_DATASOURCE_PASSWORD: ${RDS_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      PORTONE_API_SECRET: ${PORTONE_API_SECRET}
      PORTONE_CHANNEL_KEY: ${PORTONE_CHANNEL_KEY}
      PORTONE_STORE_ID: ${PORTONE_STORE_ID}
      PORTONE_WEBHOOK_SECRET: ${PORTONE_WEBHOOK_SECRET}
    ports:
      - "8080:8080"
    depends_on:
      - kafka
      - redis
    networks:
      - kafka-net

  # -------------------------- EC2 #2 : 컨슈머 서버 --------------------------
  consumer-server:
    build: C:/Users/UserK/Desktop/Consumer-Server
    container_name: consumer-server
    cpus: 2.0
    mem_limit: 2g
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATASOURCE_URL: jdbc:mysql://${DB_HOST}:3306/ShoppingDB?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${RDS_USER}
      SPRING_DATASOURCE_PASSWORD: ${RDS_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      TEST_KAFKA_MAX_POLL_RECORDS: 20
    ports:
      - "8081:8081"
    depends_on:
      - kafka
    networks:
      - kafka-net

volumes:
  kafka_data:
  redis_data:

networks:
  kafka-net:
    driver: bridge
